<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="120" height="60" viewBox="0 0 120 60" onload="alert('onload')">
    <script type="text/javascript">alert('script')</script>
    <foreignObject width="100" height="50">
        <body xmlns="http://www.w3.org/1999/xhtml"><iframe src="https://example.com/"></iframe></body>
    </foreignObject>
    <image href="https://example.com/tracker.png" width="10" height="10"/>
    <use xlink:href="http://example.com/evil.svg#payload"/>
    <a xlink:href="javascript:alert('link')"><rect width="10" height="10" fill="#000000"/></a>
    <rect width="120" height="60" fill="#0af" onclick="alert('click')"/>
</svg>
